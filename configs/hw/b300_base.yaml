# NVIDIA B300 (Blackwell Ultra) GPU as used by deepseek-ultrafast. Per-GPU values.
# Every constant cites docs/sources.md by key. Values marked `calibrated` are overwritten by
# sim/calibrate.py; the value here is only the starting point / leave-one-out prior.
name: B300
kind: gpu
n_chips: 8
hbm_bw: 8.0e12            # src: nv-b300 (HBM3E, 8 TB/s)
hbm_cap: 288.0e9          # src: nv-b300
hbm_eff: 0.90             # prior for leave-one-out; src: bw-microbench. calibrated
peak:                     # dense tensor-core FLOP/s; src: nv-b300
  fp4: 15.0e15
  fp8: 5.0e15
  bf16: 2.5e15
  fp32: 0.075e15          # non-tensor FP32 (vector ops)
mm_eff: 0.7               # achievable fraction when compute-bound (assumption; decode is not)
topk_rate: 2.0e12         # top-k elements/s (assumption; only matters at long context)
link_bw: 900.0e9          # NVLink 5: 1.8 TB/s bidirectional per GPU; src: nv-b300
coll_latency: 4.0e-6      # small-message one-shot all-reduce floor; src: ar-latency
prefetch: false
kernel_overhead: 2.0e-6   # calibrated
serial_round_latency: 1.0e-6
step_overhead: 0.0
engram_in_hbm: true       # deepseek-ultrafast shards the Engram tables across GPU HBM
tdp_w: 1100               # src: nv-b300
power:
  model: tdp
  load_fraction: 0.6      # assumption (swept): batch-1 decode leaves HBM ~40% idle
cost:
  rental_usd_per_gpu_hour: 6.0     # src: gpu-rental
  purchase_usd_per_gpu: 50000      # src: gpu-price (system share included)
  lifetime_years: 4
  pue: 1.3                # src: tco-power
  usd_per_kwh: 0.08       # src: tco-power
